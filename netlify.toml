[build]
  publish = "build/web"
  command = """
    curl -L https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.19.2-stable.tar.xz -o flutter.tar.xz && \
    tar xf flutter.tar.xz && \
    export PATH="$PATH:$PWD/flutter/bin" && \
    flutter precache && \
    flutter pub get && \
    flutter build web
  """